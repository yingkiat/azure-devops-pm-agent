# MVP8 Enhancement Test: Capability Map with Applications
# Tests: (1) relationship-based structure, (2) annotations, (3) combined grouping
#
# Story: "Show business capabilities and the applications that realize them,
#         grouped by capability domain, with annotations highlighting strategic items"

view:
  name: "Capability Realization Map"
  documentation: "Shows capabilities with their supporting applications, grouped by domain"
  viewpoint: "application_usage"

# NEW: Relationship-based structure (2-level)
# Parent = Capability, Children = Applications that serve it
structure:
  parent:
    type: "Capability"
  children:
    type: "ApplicationComponent"
    via: "Serving"              # Relationship type (inverted: find apps that Serve this capability)
    direction: "inbound"        # Apps point TO capabilities, so we look inbound
  layout: column                # Stack children vertically within parent

# Property-based grouping (applied to parent containers)
# Capabilities are grouped by their Domain property
grouping:
  by_property: "Domain"
  order: ["Operations", "Business Intelligence & Analytics", "IT Operations"]

# Explicit element selection (enables synthetic diagram element creation for missing capabilities)
elements:
  include:
    # Operations capabilities
    - name: "Warehouse Management"
    - name: "Data Extraction"
    - name: "Validation"
    - name: "Error Handling"
    - name: "Inventory Management"
    - name: "Supply Chain Management"
    - name: "Internal Business Applications Access"

    # Business Intelligence & Analytics capabilities
    - name: "Natural Language Query"
    - name: "AI-Powered Analysis"
    - name: "Data Visualization"
    - name: "Structured Results"

    # IT Operations capabilities
    - name: "API Integration"
    - name: "Comprehensive Logging"
    - name: "Event Logging"

    # Missing IT Security capabilities (will be created as diagram elements)
    - name: "Cybersecurity Risk Reduction"
      type: "Capability"
      override:
        Domain: "IT Security"
    - name: "Data Protection"
      type: "Capability"
      override:
        Domain: "IT Security"

    # Add order management capability that appears in relationships
    - name: "Order Management"

# NEW: Annotations (simple labels)
annotations:
  - text: "Strategic Platform"
    near: "UDW Agent"

  - text: "Critical"
    near: "Cybersecurity Risk Reduction"

  - text: "Sunset 2025"
    near: "MedQuote"

# Layout settings
layout:
  algorithm: grid
  columns: 3
  spacing_x: 150
  spacing_y: 20

# Output format
output:
  format: drawio

