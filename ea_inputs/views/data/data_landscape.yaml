    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "Microsoft Fabric"
      label: "contains"
      description: "Data and Analytics contains Microsoft Fabric."

    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "Azure Data Factory"
      label: "contains"
      description: "Data and Analytics contains Azure Data Factory."

    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "DBT"
      label: "contains"
      description: "Data and Analytics contains DBT."

    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "Power BI"
      label: "contains"
      description: "Data and Analytics contains Power BI."

    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "Tableau"
      label: "contains"
      description: "Data and Analytics contains Tableau."

    - type: "Composition"
      source_name: "Data and Analytics"
      target_name: "Power Platform"
      label: "contains"
