    - type: "Flow"
      source_name: "Azure DevOps"
      target_name: "DBT"
      label: "deploy"
      description: "Azure DevOps deploys and manages DBT transformations."

    - type: "Flow"
      source_name: "Power Platform"
      target_name: "Medlink"
      label: "outbound"
      description: "Outbound integration from Power Platform to Medlink."

# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Data and Analytics"
      role: "Central application cooperation boundary"
      treatment: "prominent"
    - element: "Microsoft Fabric"
      role: "Primary data platform"
      treatment: "prominent"
    - element: "Azure Data Factory"
      role: "Primary ingestion and orchestration platform"
      treatment: "highlighted"
    - element: "DBT"
      role: "Transformation layer"
      treatment: "highlighted"
    - element: "Tableau"
      role: "Analytics consumer"
      treatment: "normal"
    - element: "Power BI"
      role: "Analytics consumer"
      treatment: "normal"
    - element: "Power Platform"
      role: "Outbound automation service"
      treatment: "highlighted"
    - element: "Medlink"
      role: "Downstream consumer"
      treatment: "normal"
  grouping_rationale: "The core should stay central, grouped by capability domain, with inbound sources on the left and outbound consumers on the right."
  reading_order: "Start with the Data and Analytics core, then read left-to-right from source ingestion through warehousing and analytics to outbound automation."
  color_strategy: "The central data platform is visually stronger than surrounding source and consumer applications."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["Data Ingestion", "Data Warehousing", "Analytics", "Automation", "DevOps"]
  standardize_edges_to_group: false
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["Inbound Sources", "Outbound Consumers"]
  external_group_side_map:
    Inbound Sources: "left"
    Outbound Consumers: "right"
  hub_width: 760
  hub_height: 380
  center_x: 760
  center_y: 330
  external_width: 220
  external_offset: 100
  external_spacing: 28
  text_boxes:
    - kind: "stacked_lines"
      x: 540
      y: 555
      header_width: 150
      header_height: 28
      header_text: "Principles"
      line_x: 560
      line_y: 592
      line_width: 455
      line_height: 24
      line_gap: 6
      lines:
        - "Extract from source unless there are explicit performance exceptions."
        - "Follow global direction for technical standards."
        - "AI strategy remains pending global direction."

# === ANNOTATIONS ===
annotations:
  - text: "Inbound source integrations"
    near: "Azure Data Factory"
    offset_x: -138
    offset_y: 125
    width: 150
  - text: "Outbound integrations to Medlink"
    near: "Power Platform"
    offset_x: 252
    offset_y: 125
    width: 185

# === OUTPUT ===
output:
  format: "drawio"

# === ITERATIONS ===
iterations: []
