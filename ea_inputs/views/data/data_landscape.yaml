# === INTENT ===
intent:
  question: "What sits inside the Data and Analytics core, and which upstream and downstream applications integrate with it?"
  audience: "Enterprise Architecture, Data and Analytics, IT leadership"
  decision: "Validate the application boundary for Data and Analytics and its direct integrations."
  key_message: "Data and Analytics should read as a central core organised by domain, with source systems feeding in from the left and Medlink consuming outbound services on the right."

# === STORY ===
story:
  setup: "Data and Analytics is emerging as a shared internal capability spanning data engineering, analytics, automation, and platform delivery."
  tension: "The view needs to keep the internal domain structure clear while still showing which peripheral applications feed the platform and which consumers sit downstream."
  insight: "A center-surround cooperation view makes the domain boundary explicit and shows the main data and automation paths without overloading the diagram."

# === METADATA ===
metadata:
  domain: "data"
  region: "APAC"

# === VIEW DEFINITION ===
view:
  name: "Data and Analytics Landscape"
  documentation: |
    Application cooperation view for the Data and Analytics domain.
    The central collaboration contains the major platform and service components grouped into
    Data Ingestion, Data Warehousing, Analytics, Automation, and DevOps.
    Source applications integrate inbound from the left, while Medlink is shown as a downstream consumer on the right.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "Data and Analytics"
      type: "ApplicationCollaboration"
      synthetic: true
      override:
        Role: "Data and Analytics Core"
      description: "Central collaboration boundary for the data and analytics estate."

    - name: "Microsoft Fabric"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Data Warehousing"
        Role: "Data Platform"
      description: "Core data platform for warehousing and downstream data consumption."

    - name: "Azure Data Factory"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Data Ingestion"
        Role: "Data Integration"
        Roadmap Disposition: "Tolerate"
      description: "Primary ingestion and orchestration service for source extracts."

    - name: "DBT"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Data Ingestion"
        Role: "Data Transformation"
        Roadmap Disposition: "Tolerate"
      description: "Transformation layer for curated analytical models."

    - name: "Tableau"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Analytics"
        Role: "Analytics and Visualisation"
      description: "Analytics and reporting consumer of curated data."

    - name: "Power BI"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Analytics"
        Role: "Analytics and Visualisation"
        Roadmap Disposition: "Invest"
      description: "Business intelligence and reporting consumer of curated data."

    - name: "Power Platform"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Automation"
        Role: "Low-Code Automation"
        Roadmap Disposition: "Invest"
      description: "Low-code automation and app capability."

    - name: "Azure DevOps"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "DevOps"
        Role: "Platform Delivery"
        Roadmap Disposition: "Tolerate"
      description: "Delivery, release, and pipeline platform supporting Data and Analytics services."

    - name: "Pro2SQL"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "left"
        External Group: "Inbound Sources"
        Role: "Source System"
        Roadmap Disposition: "Tolerate"
      description: "Inbound source feeding the Data and Analytics platform."

    - name: "Microsoft SQL Server"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "left"
        External Group: "Inbound Sources"
        Role: "Source System"
        Roadmap Disposition: "Tolerate"
      description: "Inbound database source feeding the Data and Analytics platform."

    - name: "Medlink"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "right"
        External Group: "Outbound Consumers"
        Role: "Downstream Consumer"
        Roadmap Disposition: "Tolerate"
      description: "Downstream application receiving outbound integrations from Data and Analytics automation services."

# === RELATIONSHIPS ===
