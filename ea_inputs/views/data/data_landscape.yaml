      label: "transform"
      description: "DBT transforms and structures data within Microsoft Fabric."

    - type: "Flow"
      source_name: "Microsoft Fabric"
      target_name: "Tableau"
      label: "serve"
      description: "Microsoft Fabric provides curated data to Tableau."

    - type: "Flow"
      source_name: "Microsoft Fabric"
      target_name: "Power BI"
      label: "serve"
      description: "Microsoft Fabric provides curated data to Power BI."

    - type: "Flow"
      source_name: "Azure DevOps"
