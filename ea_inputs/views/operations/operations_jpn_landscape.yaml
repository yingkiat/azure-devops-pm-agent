# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Operations - JPN"
      role: "Central operations collaboration boundary"
      treatment: "prominent"
    - element: "W3 Sirius"
      role: "Primary inbound operational integration target"
      treatment: "highlighted"
    - element: "PSS 1.0"
      role: "Primary Pro2SQL integration target"
      treatment: "highlighted"
    - element: "QAD SE 11"
      role: "Upstream ERP source"
      treatment: "normal"
    - element: "Pro2SQL JPN"
      role: "Upstream replicated ERP source"
      treatment: "normal"
    - element: "Yusen"
      role: "Upstream logistics source"
      treatment: "normal"
    - element: "VC Vendor Collaboration"
      role: "Upstream vendor collaboration source"
      treatment: "normal"
  grouping_rationale: "Operations - JPN should remain central, with internal applications grouped by operational function and upstream source systems kept outside the boundary on the left."
  reading_order: "Start at the Operations - JPN core, then read across the production and QA, warehouse, planning, and QARA groups, with inbound source links read from left to right."
  color_strategy: "The operations core and the main inbound integration targets are visually stronger than surrounding applications."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["Production/QA", "Warehouse", "Planning", "QARA"]
  standardize_edges_to_group: true
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["Input Systems"]
  external_group_side_map:
