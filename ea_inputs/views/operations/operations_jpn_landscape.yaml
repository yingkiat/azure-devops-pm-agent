# === INTENT ===
intent:
  question: "What sits inside the Operations - JPN core, and which upstream ERP and logistics systems integrate with it?"
  audience: "Enterprise Architecture, Operations leadership, ERP delivery"
  decision: "Validate the JPN operations application boundary and the key inbound integrations from ERP and logistics sources."
  key_message: "Operations - JPN should read as a central core organised by operational domain, with QAD SE 11, Pro2SQL JPN, Yusen, and VC Vendor Collaboration feeding selected operations applications from the left."

# === STORY ===
story:
  setup: "The JPN operations estate spans production and QA, warehousing, planning, and quality and regulatory applications."
  tension: "The view needs to show the internal operational groupings clearly while making the key inbound dependencies from ERP and logistics sources explicit."
  insight: "A center-surround cooperation view keeps Operations - JPN visually coherent while making inbound source-to-operations integrations easy to read."

# === METADATA ===
metadata:
  domain: "operations"
  region: "JPN"

# === VIEW DEFINITION ===
view:
  name: "Operations JPN Landscape"
  documentation: |
    Application cooperation view for the JPN operations domain.
    Operations - JPN is the central collaboration boundary.
    The internal estate is grouped into Production/QA, Warehouse, Planning, and QARA.
    QAD SE 11, Pro2SQL JPN, Yusen, and VC Vendor Collaboration are shown on the left as upstream systems with direct inbound integrations.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "Operations - JPN"
      type: "ApplicationCollaboration"
      synthetic: true
      override:
        Role: "Operations JPN Core"
      description: "Central JPN operations collaboration boundary."

    - name: "W3 Sirius"
      override:
        Internal Group: "Production/QA"
        Span To Group: "Warehouse"
        Role: "Production and Warehouse Operations"
      description: "Primary JPN warehouse and operational execution system."

    - name: "Kenpin Barcode"
      override:
        Internal Group: "Production/QA"
        Role: "Barcode Tracking"
      description: "Assembly inventory tracking system used in production operations."

    - name: "PSS 1.0"
      override:
        Internal Group: "Production/QA"
        Role: "Pack Specification"
      description: "Pack specification application used by JPN operations."

    - name: "Iwagaki Access"
      override:
        Internal Group: "Production/QA"
        Role: "Production Access Tooling"
      description: "Access-based tooling supporting manufacturing and planning processes."

    - name: "Cargo Master"
      override:
        Internal Group: "Warehouse"
        Role: "Warehouse Management"
      description: "Warehouse management system for 3PL warehouse operations."

    - name: "GSCM/OCTS"
      override:
        Internal Group: "Warehouse"
        Role: "Inbound Shipment Tracking"
      description: "Inbound shipment tracking application for warehouse operations."

    - name: "Okumarukun"
      override:
        Internal Group: "Warehouse"
        Role: "Delivery Tracking"
      description: "Delivery tracking application for JPN warehouse flows."

    - name: "Informat"
      override:
        Internal Group: "Warehouse"
        Role: "Invoice Generation"
      description: "Invoice generation application supporting warehouse operations."

    - name: "DSX"
      override:
        Internal Group: "Planning"
        Role: "Demand Planning"
      description: "Planning application supporting JPN operations."

    - name: "Quality Designer"
      override:
        Internal Group: "QARA"
        Role: "Quality Management"
        Roadmap Disposition: "Tolerate"
      description: "Quality management application used in JPN operations."

    - name: "Education Designer"
      override:
        Internal Group: "QARA"
        Role: "Training and Compliance"
      description: "Training and compliance application used in JPN operations."

    - name: "Rimsys"
      override:
        Internal Group: "QARA"
        Role: "Regulatory Information Management"
      description: "Global regulatory information and product registration management application."

    - name: "ETQ Reliance"
      override:
        Internal Group: "QARA"
        Role: "Quality and Regulatory"
      description: "Global quality management system for regulatory assurance."

    - name: "QAD SE 11"
      override:
        Spoke Side: "left"
        External Group: "Input Systems"
        Role: "ERP Core"
      description: "Upstream ERP system integrating into JPN operations."

    - name: "Pro2SQL JPN"
      override:
        Spoke Side: "left"
        External Group: "Input Systems"
        Role: "Reporting and Replication"
      description: "Upstream replicated ERP data service integrating into JPN operations."

    - name: "Yusen"
      override:
        Spoke Side: "left"
        External Group: "Input Systems"
        Role: "Logistics Source"
      description: "Upstream logistics service provider integrating into JPN operations."

    - name: "VC Vendor Collaboration"
      override:
        Spoke Side: "left"
        External Group: "Input Systems"
        Role: "Vendor Collaboration"
      description: "Upstream vendor collaboration portal integrating into JPN operations."

