# Operations Applications Landscape View
# Hierarchical grouping: Region (primary, rows) → Sub-Domain (secondary, columns)
# This view organizes operations applications by geographic region with subdivisions

view:
  name: "Operations Applications Landscape"
  documentation: "Hierarchical landscape view of operations applications organized by region (rows) and sub-domain (columns)"
  viewpoint: "application_cooperation"

elements:
  include:
    # Select only Operations ApplicationComponents
    - where:
        type: "ApplicationComponent"
        Domain: "Operations"

relationships:
  include:
    # Show serving relationships between applications
    - type: ["Serving", "Flow"]
      between: "included_elements"

# Two-level hierarchical grouping: Region → Sub-Domain
grouping:
  by_property: "Region"                          # Primary grouping: Region
  secondary_by_property: "Sub-Domain"            # Secondary grouping: Sub-Domain (columns)
  order: ["ANZ", "JPN", "AEM", "_ungrouped"]    # Region order
  groups_per_row: 2                              # Two regions side by side
  group_width: 780                               # Narrower containers for 2-abreast layout
  group_spacing_x: 40                            # Gap between side-by-side groups
  group_spacing_y: 50                            # Gap between rows of groups

layout:
  algorithm: "grid"                              # Grid layout: sub-domains as columns (left to right)
  columns: 6                                     # Up to 6 sub-domains per region (Manufacturing, Distribution, Supply Chain, Finance, RAQA, Other)
  spacing_x: 120                                 # Horizontal spacing between sub-domain columns
  spacing_y: 40                                  # Vertical spacing between apps within columns

# View Structure (ASCII diagram):
#
# ┌─────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ ANZ Region                                                                                      │
# ├─────────────────────┬─────────────────────┬─────────────────────┬─────────────────────┬────────┤
# │ Manufacturing       │ Distribution        │ Supply Chain        │ Finance             │ Other  │
# ├─────────────────────┼─────────────────────┼─────────────────────┼─────────────────────┼────────┤
# │ [app] [app] [app]   │ [app] [app]         │ [app]               │ [app] [app]         │ [app]  │
# │ [app]               │ [app] [app]         │                     │ [app]               │        │
# │ [app]               │                     │                     │                     │        │
# └─────────────────────┴─────────────────────┴─────────────────────┴─────────────────────┴────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ JPN Region                                                                                      │
# ├─────────────────────┬─────────────────────┬─────────────────────┬─────────────────────┬────────┤
# │ Manufacturing       │ Distribution        │ Supply Chain        │ Finance             │ Other  │
# ├─────────────────────┼─────────────────────┼─────────────────────┼─────────────────────┼────────┤
# │ [app] [app]         │ [app] [app] [app]   │ [app] [app]         │ [app]               │ [app]  │
# │ [app]               │ [app]               │ [app]               │ [app] [app]         │        │
# └─────────────────────┴─────────────────────┴─────────────────────┴─────────────────────┴────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ AEM Region                                                                                      │
# ├─────────────────────┬─────────────────────┬─────────────────────┬─────────────────────┬────────┤
# │ Manufacturing       │ Distribution        │ Supply Chain        │ Finance             │ Other  │
# ├─────────────────────┼─────────────────────┼─────────────────────┼─────────────────────┼────────┤
# │ [app]               │ [app] [app]         │ [app]               │ [app]               │        │
# │ [app] [app]         │ [app]               │ [app] [app]         │ [app] [app]         │        │
# └─────────────────────┴─────────────────────┴─────────────────────┴─────────────────────┴────────┘
