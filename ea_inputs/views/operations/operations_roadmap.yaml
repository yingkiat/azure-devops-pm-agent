# Operations Refresh Transformation Roadmap
# Epic: operations-refresh
# Sequence: 01 of 01 (single impactful view)

# === INTENT ===
intent:
  question: "How do we modernize fragmented operations systems into a unified platform?"
  audience: "Steering Committee - focused on risk reduction and operational efficiency"
  decision: "Approve Operations Refresh program: PSS 1.0 upgrade and W3 Sirius expansion"
  key_message: "Legacy fragmentation (Excel macros, Access DB) creates risk; W3 Sirius + PSS modernization provides unified operations platform"

# === STORY ===
story:
  setup: |
    Operations run on a fragmented landscape of legacy systems across ANZ and Japan.
    Distribution uses separate systems (W3 Sirius in ANZ, Cargo Master in Japan).
    Manufacturing relies on COTS (Kenpin Barcode) and unsupported Access database (Iwagaki).
    GSCM/OCTS is Excel macros pulling data from Yusen and QAD - fragile and manual.

  tension: |
    This fragmentation creates multiple risks:
    - Iwagaki Access database is unsupported legacy technology
    - GSCM/OCTS Excel macros are fragile and error-prone
    - No unified view of distribution across ANZ and Japan
    - Kenpin Barcode COTS approaching end-of-life
    - PSS requires modernization for continued product support

  insight: |
    The Operations Refresh program provides a path forward:
    - PSS 1.0 Upgrade addresses product support modernization (Priority 1)
    - W3 Sirius Extension (DHR) replaces Kenpin Barcode + Iwagaki with proper Manufacturing module
    - W3 Sirius Japan Expansion unifies distribution platform across regions
    - Eliminates Excel macro dependencies through proper integration

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "GSCM/OCTS"
      role: "Excel macros - fragile, manual integration"
      treatment: "faded"
    - element: "Kenpin Barcode"
      role: "COTS system for assembly - sunset"
      treatment: "faded"
    - element: "Iwagaki"
      role: "Access database - unsupported legacy"
      treatment: "faded"
    - element: "W3 Sirius"
      role: "Current ANZ distribution - expanding to unified platform"
      treatment: "normal"
    - element: "PSS 1.0 Upgrade"
      role: "Priority 1 - Product Support modernization"
      treatment: "highlighted"
    - element: "W3 Sirius Extension (DHR)"
      role: "Strategic Manufacturing module replacing legacy"
      treatment: "prominent"
    - element: "W3 Sirius Japan Expansion"
      role: "Unified distribution across ANZ + Japan"
      treatment: "prominent"

  grouping_rationale: |
    Time-horizon swimlanes (Today -> 2025-2026 -> Target) show transformation journey.
    Within each horizon, group by operational domain to show functional coverage.
    This reveals how fragmented point solutions consolidate into unified platforms.

  reading_order: |
    Top to bottom: Current state (fragmented) -> Transition (what changes) -> Target (unified)
    Left to right within each row: Supply Chain -> Distribution -> Manufacturing -> Product Support
    Color tells lifecycle: Gray = legacy/sunset, Blue = strategic, Green = new capability

  color_strategy: |
    - Faded gray: Legacy systems (GSCM/OCTS, Kenpin Barcode, Iwagaki)
    - Normal: Stable systems continuing (SAP APO, W3 Sirius, Yusen)
    - Blue/highlighted: Priority upgrade (PSS 1.0 Upgrade)
    - Green/prominent: Strategic expansion (W3 Sirius DHR, Japan Expansion)

# === VIEW DEFINITION ===
view:
  name: "Operations Refresh Transformation Roadmap"
  documentation: |
    Single-view transformation story showing the journey from fragmented legacy
    operations systems to unified W3 Sirius and modernized PSS platforms.

    Timeline:
    - H1 (TODAY): Fragmented systems - W3 Sirius (ANZ only), Cargo Master (Japan),
      Excel macros (GSCM/OCTS), COTS (Kenpin Barcode)
    - H2 (2025-2026): PSS 1.0 Upgrade (Priority 1), W3 Sirius DHR module, Japan expansion
    - H3 (TARGET): Unified W3 Sirius platform (ANZ + Japan), modern PSS, DHR manufacturing, legacy sunset

