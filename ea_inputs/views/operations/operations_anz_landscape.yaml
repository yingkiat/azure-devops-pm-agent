# === INTENT ===
intent:
  question: "What sits inside the Operations - ANZ core, and which upstream ERP components integrate with it?"
  audience: "Enterprise Architecture, Operations leadership, ERP delivery"
  decision: "Validate the ANZ operations application boundary and the key inbound integrations from ERP."
  key_message: "Operations - ANZ should read as a central core organised by operational domain, with QAD EE 2019 and Pro2SQL ANZ feeding selected production applications from the left."

# === STORY ===
story:
  setup: "The ANZ operations estate spans production support, warehousing, planning, and quality and regulatory applications."
  tension: "The view needs to show the internal operational groupings clearly without losing sight of the two key ERP-to-operations integration paths."
  insight: "A center-surround cooperation view keeps Operations - ANZ visually coherent while making the inbound ERP dependencies explicit."

# === METADATA ===
metadata:
  domain: "operations"
  region: "ANZ"

# === VIEW DEFINITION ===
view:
  name: "Operations ANZ Landscape"
  documentation: |
    Application cooperation view for the ANZ operations domain.
    Operations - ANZ is the central collaboration boundary.
    The internal estate is grouped into Production/QA, Warehouse, Planning, and QARA.
    QAD EE 2019 and Pro2SQL ANZ are shown on the left as upstream systems with direct inbound integrations.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "Operations - ANZ"
      type: "ApplicationCollaboration"
      synthetic: true
      override:
        Role: "Operations ANZ Core"
      description: "Central ANZ operations collaboration boundary."

    - name: "Label Printing"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Production Labelling"
      description: "Production labelling application for ANZ operations."

    - name: "Batch Control"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Batch Control"
      description: "Batch control application supporting production execution."

    - name: "PSS 1.0"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Pack Specification"
      description: "Pack specification application used by ANZ operations."

    - name: "ETO Consignment"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Consignment Operations"
      description: "Consignment support application for operations."

    - name: "eiFU"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Electronic IFU"
      description: "Electronic instructions for use application."

    - name: "Label Printing Sino"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Production/QA"
        Role: "Contractor Labelling"
      description: "Contractor labelling application used for Sino production flows."

    - name: "SmartFreight"
      type: "ApplicationComponent"
      override:
        Internal Group: "Warehouse"
        Role: "Freight Management"
      description: "Warehouse and freight support application."

    - name: "Descartes"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Warehouse"
        Role: "Transport Management"
      description: "Warehouse transport management application."

    - name: "MIMS"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Warehouse"
        Role: "Warehouse Operations"
      description: "Warehouse support application."

    - name: "QAD WMS"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "Warehouse"
        Role: "Warehouse Management"
        Roadmap Disposition: "Tolerate"
      description: "Warehouse management system for ANZ operations."

    - name: "DSX"
      type: "ApplicationComponent"
      override:
        Internal Group: "Planning"
        Role: "Demand Planning"
      description: "Planning application supporting ANZ operations."

    - name: "Rimsys"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Internal Group: "QARA"
        Role: "Quality and Regulatory"
      description: "Quality assurance and regulatory application."

    - name: "QAD EE 2019"
      type: "ApplicationComponent"
      override:
        Spoke Side: "left"
        External Group: "ERP Sources"
        Role: "ERP Core"
      description: "Upstream ERP system integrating into ANZ operations."

    - name: "Pro2SQL ANZ"
      type: "ApplicationComponent"
      override:
        Spoke Side: "left"
        External Group: "ERP Sources"
        Role: "Reporting and Replication"
      description: "Upstream replicated ERP data service integrating into ANZ operations."

