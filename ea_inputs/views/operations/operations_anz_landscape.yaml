# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Operations - ANZ"
      role: "Central operations collaboration boundary"
      treatment: "prominent"
    - element: "Label Printing"
      role: "Primary production integration target"
      treatment: "highlighted"
    - element: "PSS 1.0"
      role: "Primary Pro2SQL integration target"
      treatment: "highlighted"
    - element: "QAD EE 2019"
      role: "Upstream ERP source"
      treatment: "normal"
    - element: "Pro2SQL ANZ"
      role: "Upstream replicated ERP source"
      treatment: "normal"
  grouping_rationale: "Operations - ANZ should remain central, with internal applications grouped by operational function and upstream ERP systems kept outside the boundary on the left."
  reading_order: "Start at the Operations - ANZ core, then read across the production, warehouse, planning, and QARA groups, with the inbound ERP links read from left to right."
  color_strategy: "The operations core and the two inbound integration targets are visually stronger than surrounding applications."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["Production/QA", "Warehouse", "Planning", "QARA"]
  standardize_edges_to_group: true
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["ERP Sources"]
  external_group_side_map:
