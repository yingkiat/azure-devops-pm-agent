# Infrastructure Cost Optimization Roadmap

# === INTENT ===
intent:
  question: "How do we reduce infrastructure overspend while improving service delivery?"
  audience: "IT Management and Finance - concerned with cloud costs and operational efficiency"
  decision: "Prioritize infrastructure modernization initiatives that deliver cost savings"
  key_message: "Shift from always-on VMs to serverless/containers, consolidate regions and helpdesks to reduce operational costs by ~40%"

# === STORY ===
story:
  setup: "Current state shows fragmented infrastructure with high Azure VM costs, dual-region overhead, separate helpdesks, and basic EUC capabilities"
  tension: "Overspend on Azure (DEV/TEST always running) and local DCs; ad-hoc monitoring; fragmented support across regions"
  insight: "Serverless architecture + regional consolidation + unified support platform can deliver significant cost reduction while improving user experience"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Azure Container Apps"
      role: "Key modernization platform replacing VMs"
      treatment: "prominent"
    - element: "Serverless Databases"
      role: "Cost-efficient data layer"
      treatment: "prominent"
    - element: "Consolidated Global Helpdesk"
      role: "Unified support reducing overhead"
      treatment: "prominent"
    - element: "Heavy VM Expenditure"
      role: "Problem area - costly legacy approach"
      treatment: "faded"
    - element: "Separate Global/APAC Helpdesks"
      role: "Inefficient current state"
      treatment: "faded"
  grouping_rationale: "Group by infrastructure domain (Cloud, EUC, Support) to show parallel modernization tracks; time horizons show evolution from costly current state to optimized future"
  reading_order: "Left to right across domains, top to bottom through time horizons - see current pain points (H1) transform into strategic solutions (H3)"
  color_strategy: "Green = strategic initiatives delivering cost savings; Red = expensive legacy patterns being sunset; Blue = standard platforms; faded = current inefficiencies"

# === VIEW DEFINITION ===
view:
  name: "Infrastructure Cost Optimization Roadmap"
  documentation: "Infrastructure transformation roadmap focused on reducing Azure and DC overspend through serverless adoption, regional consolidation, and unified support services"

