# === INTENT ===
intent:
  question: "What sits inside the ANZ ERP core, and what direct external applications cooperate with it?"
  audience: "Enterprise Architecture, ERP delivery, Finance stakeholders"
  decision: "Validate the ANZ ERP application boundary and its direct external integrations before expanding to JPN and AEM"
  key_message: "ERP ANZ should read as a central core containing QAD EE 2019 and Pro2SQL ANZ, with external systems arranged around it"

# === STORY ===
story:
  setup: "The ANZ ERP landscape has a clear internal core and a growing set of direct outbound integrations."
  tension: "As external integrations grow, the diagram must preserve the ERP ANZ boundary while still making each source-to-target integration explicit."
  insight: "A center-surround application cooperation view keeps the ERP core stable in the middle while allowing many external systems to grow around it."

# === METADATA ===
metadata:
  domain: "ERP"
  region: "ANZ"

# === VIEW DEFINITION ===
view:
  name: "ERP ANZ Landscape"
  documentation: |
    Application cooperation view for the ANZ ERP realm.
    ERP ANZ is the central collaboration/core.
    QAD EE 2019 and Pro2SQL ANZ are contained within that core.
    External systems sit around the core and connect only through explicit outbound flows.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "ERP ANZ"
      type: "ApplicationCollaboration"
      override:
        Role: "ERP ANZ Core"
      description: "Central ANZ ERP collaboration boundary."

    - name: "QAD EE 2019"
