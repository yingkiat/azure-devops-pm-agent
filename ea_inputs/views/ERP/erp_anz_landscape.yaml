# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "ERP ANZ"
      role: "Central application cooperation boundary"
      treatment: "prominent"
    - element: "QAD EE 2019"
      role: "Primary ERP application inside the ANZ core"
      treatment: "prominent"
    - element: "Pro2SQL ANZ"
      role: "Supporting ANZ ERP component inside the core"
      treatment: "highlighted"
    - element: "Boomi"
      role: "Internal integration middleware"
      treatment: "normal"
    - element: "Informatica PIM ANZ"
      role: "Internal product information integration"
      treatment: "normal"
    - element: "EDI"
      role: "Internal EDI integration component"
      treatment: "normal"
    - element: "Blackline Financial Close"
      role: "External finance close integration"
      treatment: "normal"
  grouping_rationale: "ERP ANZ should be visually central, with external systems kept outside the core boundary."
  reading_order: "Start in the middle with ERP ANZ, then read outward to its connected external systems."
  color_strategy: "Core elements are visually stronger than surrounding external systems."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["QAD", "Services", "Integration"]
  standardize_edges_to_group: true
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["Commercial", "Planning", "Finance", "Logistics", "Manufacturing Operations", "Reporting"]
  external_group_side_map:
    Commercial: "top"
    Planning: "top"
    Finance: "left"
    Logistics: "right"
    Manufacturing Operations: "right"
    Reporting: "left"
  hub_width: 560
  hub_height: 360
  center_y: 330
  external_width: 220
  external_offset: 90
  external_spacing: 24

# === ANNOTATIONS ===
annotations:
  - text: "QAD-led outbound integrations"
    near: "QAD EE 2019"
    offset_x: -20
    offset_y: -110
    width: 170
  - text: "Pro2SQL-led outbound integrations"
    near: "Pro2SQL ANZ"
    offset_x: -10
    offset_y: -110
    width: 190

# === OUTPUT ===
output:
  format: "drawio"

# === ITERATIONS ===
iterations: []
