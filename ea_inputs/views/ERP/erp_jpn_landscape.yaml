# === INTENT ===
intent:
  question: "What sits inside the JPN ERP core, and what direct external applications cooperate with it?"
  audience: "Enterprise Architecture, ERP delivery, Finance stakeholders"
  decision: "Validate the JPN ERP application boundary and its direct external integrations"
  key_message: "ERP JPN should read as a central core containing QAD SE 11 and Pro2SQL JPN, with external systems arranged around it"

# === STORY ===
story:
  setup: "The JPN ERP landscape has a clear internal core and a broad set of direct outbound integrations."
  tension: "The diagram needs to preserve the ERP JPN boundary while still making each source-to-target integration explicit."
  insight: "A center-surround application cooperation view keeps the ERP core stable in the middle while allowing many external systems to grow around it."

# === VIEW DEFINITION ===
view:
  name: "ERP JPN Landscape"
  documentation: |
    Application cooperation view for the JPN ERP realm.
    ERP JPN is the central collaboration/core.
    QAD SE 11 and Pro2SQL JPN are contained within that core.
    External systems sit around the core and connect only through explicit outbound flows.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "ERP JPN"
      type: "ApplicationCollaboration"
      override:
        Role: "ERP JPN Core"
      description: "Central JPN ERP collaboration boundary."

    - name: "QAD SE 11"
      override:
        Internal Group: "QAD"
        Role: "ERP Core"
      description: "Primary JPN ERP platform."

    - name: "Pro2SQL JPN"
      override:
        Internal Group: "Services"
        Role: "ERP Core"
      description: "JPN ERP reporting/data component."

    - name: "Bank Payments System"
      override:
        Internal Group: "Integration"
        Role: "ERP Integration"
      description: "Payments integration component inside ERP JPN."

    - name: "Boomi"
      override:
        Internal Group: "Integration"
        Role: "ERP Integration"
      description: "Integration middleware component inside ERP JPN."

    - name: "Informatica PIM JPN"
      override:
        Internal Group: "Integration"
        Role: "ERP Integration"
      description: "Product information management integration component inside ERP JPN."

    - name: "EDI"
      override:
        Internal Group: "Integration"
        Role: "ERP Integration"
      description: "EDI integration component inside ERP JPN."

    - name: "GSC SAP APO"
      override:
        Spoke Side: "top"
        External Group: "Planning"
        Role: "Supply Chain Planning"
      description: "Forecast outbound from QAD SE 11."

    - name: "DSX"
      override:
        Spoke Side: "top"
        External Group: "Planning"
        Role: "Forecasting"
      description: "Forecast outbound from QAD SE 11."

    - name: "Formtrap"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "right"
        External Group: "Finance"
        Role: "Invoice Output"
      description: "Invoice outbound from QAD SE 11."

    - name: "Infomart"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "right"
        External Group: "Finance"
        Role: "Invoice and Shipment Integration"
      description: "Invoice and shipment outbound from QAD SE 11."

    - name: "CargoMaster Japan WMS"
      override:
        Spoke Side: "right"
        External Group: "Logistics"
        Role: "Warehouse Management"
      description: "PO/SO outbound from QAD SE 11."

    - name: "W3 Sirius"
      override:
        Spoke Side: "right"
        External Group: "Logistics"
        Role: "Warehouse Management"
      description: "PO/SO outbound from QAD SE 11."

    - name: "MD-NET"
      override:
        Spoke Side: "left"
        External Group: "Commercial"
        Role: "EDI Network"
      description: "EDI outbound from QAD SE 11."

    - name: "SFDC"
      override:
        Spoke Side: "left"
        External Group: "Commercial"
        Role: "CRM Integration"
      description: "Sales and shipment data outbound from QAD SE 11."

    - name: "Kenpin JPN"
      override:
        Spoke Side: "left"
        External Group: "Manufacturing Operations"
        Role: "Operational Tracking"
      description: "Item outbound from QAD SE 11."

    - name: "JPMorgan Online"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "bottom"
        External Group: "Finance"
        Role: "Banking"
      description: "Payment outbound from QAD SE 11."

    - name: "Yusen"
      override:
        Spoke Side: "bottom"
        External Group: "Logistics"
        Role: "Logistics Integration"
      description: "PO outbound from QAD SE 11."

    - name: "Okumarukun"
      override:
        Spoke Side: "bottom"
        External Group: "Logistics"
        Role: "Delivery Tracking"
      description: "Shipment data outbound from QAD SE 11."

    - name: "X-Point"
      override:
        Spoke Side: "bottom"
        External Group: "Finance"
        Role: "Finance Integration"
      description: "Journal entries outbound from QAD SE 11."

    - name: "Tableau"
      override:
        Spoke Side: "left"
        External Group: "Reporting"
        Role: "Reporting"
      description: "Outbound from Pro2SQL JPN."

    - name: "Oracle EPM"
      override:
        Spoke Side: "top"
        External Group: "Planning"
        Role: "Planning and Reporting"
      description: "Account balance outbound from Pro2SQL JPN."

    - name: "PSS 1.0"
      override:
        Spoke Side: "left"
        External Group: "Manufacturing Operations"
        Role: "Specification Management"
      description: "Item/BOM outbound from Pro2SQL JPN."

    - name: "MedQuote"
      override:
        Spoke Side: "left"
        External Group: "Commercial"
        Role: "Quote Integration"
      description: "Item outbound from Pro2SQL JPN."

