# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "ERP JPN"
      role: "Central application cooperation boundary"
      treatment: "prominent"
    - element: "QAD SE 11"
      role: "Primary ERP application inside the JPN core"
      treatment: "prominent"
    - element: "Pro2SQL JPN"
      role: "Supporting JPN ERP component inside the core"
      treatment: "highlighted"
    - element: "Bank Payments System"
      role: "Internal payments integration component"
      treatment: "normal"
    - element: "Boomi"
      role: "Internal integration middleware"
      treatment: "normal"
    - element: "Informatica PIM JPN"
      role: "Internal product information integration"
      treatment: "normal"
    - element: "EDI"
      role: "Internal EDI integration component"
      treatment: "normal"
  grouping_rationale: "ERP JPN should be visually central, with external systems kept outside the core boundary."
  reading_order: "Start in the middle with ERP JPN, then read outward to its connected external systems."
  color_strategy: "Core elements are visually stronger than surrounding external systems."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["QAD", "Services", "Integration"]
  standardize_edges_to_group: true
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["Commercial", "Planning", "Finance", "Logistics", "Manufacturing Operations", "Reporting"]
  external_group_side_map:
    Commercial: "left"
    Planning: "top"
    Finance: "right"
    Logistics: "right"
    Manufacturing Operations: "left"
    Reporting: "left"
  hub_width: 560
  hub_height: 360
  center_y: 330
  external_width: 220
  external_offset: 90
  external_spacing: 24

# === ANNOTATIONS ===
annotations:
  - text: "Central ERP JPN cooperation boundary"
    near: "ERP JPN"
  - text: "QAD-led outbound integrations"
    near: "QAD SE 11"
  - text: "Pro2SQL-led outbound integrations"
    near: "Pro2SQL JPN"

# === OUTPUT ===
output:
  format: "drawio"

# === ITERATIONS ===
iterations: []
