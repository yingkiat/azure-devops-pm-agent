# === INTENT ===
intent:
  question: "What are the first two QAD migration options?"
  audience: "ERP leadership, PMO, enterprise architecture"
  decision: "Compare the migration paths into QAD AUX versus SAP S/4HANA"
  key_message: "Option 1 upgrades into QAD AUX; Option 2 upgrades into SAP S/4HANA, with both paths passing through an analytical database and Boomi to common downstream services"

# === STORY ===
story:
  setup: "Today the ERP estate is split across ANZ, AEM, and JPN QAD variants."
  tension: "The migration path must reduce fragmentation while sequencing the rollout in a lower-risk order."
  insight: "The two options share the same source estate and downstream service pattern, but differ in their target core and analytical database choices."

# === METADATA ===
metadata:
  domain: "ERP"
  region: "APAC"

# === VIEW DEFINITION ===
view:
  name: "QAD Migration Options"
  documentation: |
    Comparison view showing two stacked migration options from the three current QAD instances
    into alternative target cores, then through an analytical database and Boomi to shared
    downstream services.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
