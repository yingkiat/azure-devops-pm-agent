  - version: 1.4
    date: "2025-01-20"
    feedback: "Layer swimlanes should use semantic colors for visual clarity - yellow for business, blue for tech, grey for context."
    change: "Added color/stroke properties to each layer in layout.layers. Established default color palette: Yellow (Business), Orange (Strategy/Capability), Blue (Application), Light Green (Infrastructure), Grey (Internal/Context)."
  - version: 1.5
    date: "2025-01-20"
    feedback: "Manual refinements in draw.io: simplified element labels for clarity, adjusted Internal Systems container width."
    change: "Updated element names: 'Hospital Buyers'→'Hospitals', 'Backend API'→'Portal Backend', 'MedPack Aus'→'MedPack', 'QAD Analytics Database'→'QAD DB'. Set Internal Systems layer width to 450px. Added fontColor to grey layer."
  - version: 1.6
    date: "2025-01-21"
    feedback: "MedPack NZ removed from manually refined diagram - architecture simplified to single MedPack source."
