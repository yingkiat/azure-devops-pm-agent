# === INTENT ===
intent:
  question: "What sits inside the Commercial JPN core, and how does it integrate with upstream and downstream enterprise systems?"
  audience: "Enterprise Architecture, Commercial leadership, ERP delivery"
  decision: "Validate the JPN commercial application boundary and the key bidirectional ERP and quality integrations."
  key_message: "Commercial JPN should read as a central business application core, with Microsoft Dynamics spanning customer service, sales, and SPT, fed by QAD SE 11 on the left and integrating back to QAD SE 11 on the right, while downstream reporting flows into Microsoft Fabric."

# === STORY ===
story:
  setup: "The JPN commercial estate spans customer service, sales, SPT, marketing, and finance applications."
  tension: "The view needs to show Microsoft Dynamics as a cross-cutting platform while also making QAD SE 11 visible as both an inbound and outbound enterprise integration, with reporting data flowing downstream into Microsoft Fabric."
  insight: "A hub-and-spoke landscape with a spanning node, mirrored ERP touchpoints, and a dedicated data warehouse spoke makes the internal commercial structure clear without hiding the operational and reporting dependencies."

# === METADATA ===
metadata:
  domain: "commercial"
  region: "JPN"

# === VIEW DEFINITION ===
view:
  name: "Commercial JPN Landscape"
  documentation: |
    Application cooperation view for the JPN commercial domain.
    Commercial JPN is the central collaboration boundary.
    The internal estate is grouped into Customer Service, Sales, SPT, Marketing, and Finance.
    Microsoft Dynamics spans Customer Service, Sales, and SPT.
    QAD SE 11 is shown on the left as an upstream ERP source into Microsoft Dynamics and SFDC, and on the right as a downstream ERP target from Microsoft Dynamics and Finance.
    SFDC and KMS also integrate downstream into Microsoft Fabric for reporting.
    SFDC also integrates upstream into Quality Designer.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "Commercial JPN"
      type: "ApplicationCollaboration"
      synthetic: true
      override:
        Role: "Commercial JPN Core"
      description: "Central JPN commercial collaboration boundary."

    - name: "Microsoft Dynamics"
      override:
        Internal Group: "Customer Service"
        Span To Group: "SPT"
        Role: "CRM Platform"
      description: "Cross-cutting commercial platform spanning customer service, sales, and SPT."

    - name: "MD-NET"
      override:
        Internal Group: "Customer Service"
        Role: "EDI Network"
      description: "Customer service EDI platform within the JPN commercial landscape."

    - name: "EmpowerOR"
      override:
        Internal Group: "Sales"
        Role: "Order Capture"
      description: "Sales application supporting hospital and order workflows."

    - name: "SFDC"
      override:
        Internal Group: "Sales"
        Role: "Sales CRM"
      description: "Salesforce CRM used by the JPN sales function."

    - name: "KMS"
      override:
        Internal Group: "SPT"
        Role: "Kit Management"
      description: "SPT kit management system."

    - name: "Magento JPN"
      override:
        Internal Group: "Marketing"
        Role: "Digital Catalogue"
      description: "JPN commerce and catalogue platform."

    - name: "Japan CMS Website Local Vendor"
      override:
        Internal Group: "Marketing"
        Role: "Website CMS"
      description: "Locally managed JPN website CMS platform."

    - name: "JSNavi"
      override:
        Internal Group: "Finance"
        Role: "Expense Reporting"
      description: "Expense reporting application used by the JPN commercial function."

    - name: "X-Point"
      override:
        Internal Group: "Finance"
        Role: "Finance Integration"
      description: "Finance support application for the JPN commercial estate."

    - name: "QAD SE 11​"
      type: "ApplicationComponent"
      synthetic: true
      override:
        Spoke Side: "left"
        External Group: "Upstream ERP"
        Role: "ERP Source"
        Roadmap Disposition: "Tolerate"
      description: "Upstream ERP source into Microsoft Dynamics and SFDC."

    - name: "QAD SE 11"
      override:
        Spoke Side: "right"
        External Group: "Downstream ERP"
        Role: "ERP Target"
      description: "Downstream ERP target integrated from Microsoft Dynamics."

    - name: "Quality Designer"
      override:
        Spoke Side: "right"
        External Group: "Quality"
        Role: "Quality Management"
      description: "Quality management platform receiving data from SFDC."

    - name: "Microsoft Fabric"
      override:
        Spoke Side: "right"
        External Group: "Data Warehouse"
        Role: "Reporting Platform"
      description: "Enterprise data warehouse platform receiving downstream commercial reporting data."

