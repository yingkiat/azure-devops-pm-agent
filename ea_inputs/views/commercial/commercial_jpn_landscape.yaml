    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Commercial JPN"
      role: "Central commercial collaboration boundary"
      treatment: "prominent"
    - element: "Microsoft Dynamics"
      role: "Cross-cutting CRM platform spanning three commercial subgroups"
      treatment: "highlighted"
    - element: "SFDC"
      role: "Key sales platform with ERP and quality integrations"
      treatment: "highlighted"
    - element: "QAD SE 11"
      role: "ERP source and target across the landscape"
      treatment: "normal"
    - element: "Microsoft Fabric"
      role: "Downstream data warehouse for reporting"
      treatment: "normal"
    - element: "Quality Designer"
      role: "Downstream quality management integration target"
      treatment: "normal"
  grouping_rationale: "Commercial JPN remains central, with Customer Service, Sales, and SPT aligned under the Microsoft Dynamics span, followed by Marketing and Finance, and reporting integrations separated from operational and quality destinations."
  reading_order: "Start with the Commercial JPN core, read left to right across Customer Service, Sales, and SPT, then continue to Marketing and Finance, with ERP, data warehouse, and quality integrations read across the left and right edges."
  color_strategy: "The commercial core, Microsoft Dynamics, and SFDC are visually stronger than surrounding business applications and external integration endpoints, while Microsoft Fabric reads as a downstream reporting destination."

