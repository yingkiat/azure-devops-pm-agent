# === STRUCTURE ===
structure:
  parent:
    type: "ApplicationCollaboration"
  children:
    type: "ApplicationComponent"
    via: "Composition"
    direction: "outbound"
  layout: "column"

# === VISUAL STRATEGY ===
visual:
  emphasis:
    - element: "Commercial ANZ"
      role: "Central commercial collaboration boundary"
      treatment: "prominent"
    - element: "Microsoft Dynamics"
      role: "Cross-cutting CRM platform spanning three commercial subgroups"
      treatment: "highlighted"
    - element: "Magento ANZ"
      role: "Marketing platform receiving upstream product data"
      treatment: "highlighted"
    - element: "QAD EE 2019"
      role: "Downstream ERP integration target"
      treatment: "normal"
    - element: "Microsoft Fabric"
      role: "Downstream data warehouse for SPT reporting"
      treatment: "normal"
    - element: "Informatica PIM ANZ"
      role: "Upstream product information source"
      treatment: "normal"
  grouping_rationale: "Commercial ANZ remains central, with the three Microsoft Dynamics-aligned groups placed first and side by side, followed by Marketing and Finance, and with reporting integrations separated from operational ERP dependencies."
  reading_order: "Start with the Commercial ANZ core, read left to right across Customer Service, Sales, and SPT, then continue to Marketing and Finance, with the external integrations read from left to right."
  color_strategy: "The commercial core and Microsoft Dynamics are visually stronger than surrounding business applications and external integration endpoints, while Microsoft Fabric reads as a downstream reporting destination."

# === LAYOUT ===
layout:
  algorithm: "hub_spoke"
  core_group_by: "Internal Group"
  core_group_order: ["Customer Service", "Sales", "SPT", "Marketing", "Finance"]
  standardize_edges_to_group: true
  spoke_side_property: "Spoke Side"
  external_group_by: "External Group"
  external_group_order: ["Upstream Product Data", "Downstream ERP", "Data Warehouse"]
  external_group_side_map:
    Upstream Product Data: "left"
    Downstream ERP: "right"
    Data Warehouse: "right"
  hub_width: 1040
  hub_height: 360
  center_x: 820
  center_y: 320
  core_group_spacing: 18
  core_child_top: 38
  core_child_height: 60
  core_child_spacing: 22
  external_width: 220
