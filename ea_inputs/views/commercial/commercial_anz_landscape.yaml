# === INTENT ===
intent:
  question: "What sits inside the Commercial ANZ core, and how does it integrate with upstream product data and downstream ERP and reporting platforms?"
  audience: "Enterprise Architecture, Commercial leadership, ERP delivery"
  decision: "Validate the ANZ commercial application boundary and the primary cross-domain integrations."
  key_message: "Commercial ANZ should read as a central business application core, with Microsoft Dynamics spanning customer service, sales, and SPT, fed by Informatica PIM ANZ, integrating out to QAD EE 2019, and sending SPT reporting downstream into Microsoft Fabric."

# === STORY ===
story:
  setup: "The ANZ commercial estate spans customer service, sales, marketing, finance, and SPT-specific applications."
  tension: "The view needs to show Microsoft Dynamics as a cross-cutting commercial platform while still preserving clear subgroup boundaries for the wider commercial stack and making reporting dependencies visible."
  insight: "A hub-and-spoke landscape with a spanning node makes the internal commercial structure readable and highlights the key upstream, downstream ERP, and downstream reporting integrations."

# === METADATA ===
metadata:
  domain: "commercial"
  region: "ANZ"

# === VIEW DEFINITION ===
view:
  name: "Commercial ANZ Landscape"
  documentation: |
    Application cooperation view for the ANZ commercial domain.
    Commercial ANZ is the central collaboration boundary.
    The internal estate is grouped into Customer Service, Sales, SPT, Marketing, and Finance.
    Microsoft Dynamics spans Customer Service, Sales, and SPT.
    Informatica PIM ANZ is shown on the left as an upstream integration into Magento ANZ, while QAD EE 2019 is shown on the right as a downstream ERP integration from Microsoft Dynamics and Finance.
    Microsoft Fabric is shown as a downstream data warehouse receiving reporting data from the SPT subgroup.
  viewpoint: "application_cooperation"

# === ELEMENTS ===
elements:
  include:
    - name: "Commercial ANZ"
      type: "ApplicationCollaboration"
      synthetic: true
      override:
        Role: "Commercial ANZ Core"
      description: "Central ANZ commercial collaboration boundary."

    - name: "Microsoft Dynamics"
      override:
        Internal Group: "Customer Service"
        Span To Group: "SPT"
        Role: "CRM Platform"
      description: "Cross-cutting commercial platform spanning customer service, sales, and SPT."

    - name: "Customer Master (CMP)"
      override:
        Internal Group: "Sales"
        Display Name: "CMP"
        Role: "Customer Master"
      description: "Customer master data management application."

    - name: "CNS"
      override:
        Internal Group: "Sales"
        Role: "Customer Portal"
      description: "Sales-facing customer portal application."

    - name: "Magento ANZ"
      override:
        Internal Group: "Marketing"
        Role: "Digital Catalogue"
      description: "ANZ commerce and catalogue platform."

    - name: "Vimeo"
      override:
        Internal Group: "Marketing"
        Role: "Video Marketing"
      description: "Video marketing platform supporting ANZ commercial activity."

    - name: "Concur Expense Management"
      override:
        Internal Group: "Finance"
        Role: "Expense Management"
      description: "Commercial finance expense management platform."

    - name: "MedOps"
      override:
        Internal Group: "SPT"
        Role: "Operations Support"
      description: "SPT operations support application."

    - name: "MedPack"
      override:
        Internal Group: "SPT"
        Role: "Pack Management"
      description: "SPT pack and BOM viewing application."

    - name: "MedQuote"
      override:
        Internal Group: "SPT"
        Role: "Quote Management"
      description: "SPT quote creation application."

    - name: "MedReports"
      override:
        Internal Group: "SPT"
        Role: "Reporting"
      description: "SPT reporting application."

    - name: "Informatica PIM ANZ"
      override:
        Spoke Side: "left"
        External Group: "Upstream Product Data"
        Role: "Product Information Management"
      description: "Upstream product information source feeding Magento ANZ."

    - name: "QAD EE 2019"
      override:
        Spoke Side: "right"
        External Group: "Downstream ERP"
        Role: "ERP Core"
      description: "Downstream ERP platform integrated from Microsoft Dynamics."

    - name: "Microsoft Fabric"
      override:
        Spoke Side: "right"
        External Group: "Data Warehouse"
        Role: "Reporting Platform"
      description: "Enterprise data warehouse platform receiving downstream reporting data from SPT."

