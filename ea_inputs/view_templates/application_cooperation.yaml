# ArchiMate 3.1 Application Cooperation Viewpoint
# Purpose: Design and assignment of application structure and behavior

viewpoint: "application_cooperation"

archimate_spec:
  standard: "ArchiMate 3.1"
  purpose: "Design and assignment of application structure and behavior"
  concerns:
    - "Application structure"
    - "Application cooperation"
    - "Consistency and completeness"
    - "Reduction of complexity"

  typical_elements:
    - "ApplicationComponent"
    - "ApplicationInterface"
    - "ApplicationService"
    - "ApplicationFunction"
    - "DataObject"

  typical_relationships:
    - "Serving"
    - "Flow"
    - "Access"
    - "Composition"
    - "Assignment"
    - "Realization"

  validation_rules:
    - "ApplicationComponent can serve ApplicationService"
    - "ApplicationInterface realizes ApplicationService"
    - "DataObject flows between ApplicationComponents"
    - "ApplicationFunction is assigned to ApplicationComponent"

default_layout:
  algorithm: "layered"
  group_by: "layer"
  spacing_x: 50
  spacing_y: 80

# Example usage:
# Creates a view showing application components, their interfaces,
# and how they serve business capabilities or exchange data
