# ArchiMate 3.1 Layered Viewpoint
# Purpose: Full overview of architecture across all layers

viewpoint: "layered"

archimate_spec:
  standard: "ArchiMate 3.1"
  purpose: "Full overview of enterprise architecture across all layers"
  concerns:
    - "Consistency"
    - "Completeness"
    - "Dependencies"
    - "Impact of change"

  typical_elements:
    # Business Layer
    - "BusinessActor"
    - "BusinessRole"
    - "BusinessProcess"
    - "Capability"
    # Application Layer
    - "ApplicationComponent"
    - "ApplicationService"
    - "ApplicationInterface"
    # Data Layer
    - "DataObject"
    # Technology Layer
    - "Node"
    - "Device"

  typical_relationships:
    - "Serving"
    - "Realization"
    - "Assignment"
    - "Flow"
    - "Access"
    - "Composition"

  validation_rules:
    - "Business layer at top"
    - "Application layer in middle"
    - "Technology layer at bottom"
    - "Data layer can span multiple layers"

default_layout:
  algorithm: "layered"
  group_by: "layer"
  spacing_x: 50
  spacing_y: 100

# Example usage:
# Creates a comprehensive view showing how business capabilities
# are realized by applications running on infrastructure
