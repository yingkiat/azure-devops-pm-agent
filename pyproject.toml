[project]
name = "azure-devops-pm-agent"
version = "0.1.0"
description = "LLM‑powered Program/Project Manager agent for Azure DevOps"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "azure-devops>=7.1.0b4, <8.0.0",
  "msrest>=0.7.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.1",
  "openai>=1.37.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic-settings>=2.2.1",
  "mcp>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]