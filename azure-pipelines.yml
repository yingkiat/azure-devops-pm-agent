# Azure DevOps CI/CD Pipeline for EA Portal (Static HTML) - PRODUCTION
# Builds Docker image with static portal and deploys to Azure Container Apps

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/
      - .gitignore

parameters:
- name: deploymentEnvironment
  displayName: 'Deployment Environment'
  type: string
  default: 'production'
  values:
    - production
    - staging

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: ServicePrincipalProd  # 🔐 Production service principal credentials
  - name: pythonVersion
    value: '3.11'
  - name: imageRepository
    value: 'azdo-pm-ea-agent'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  # Production-specific resource names - UPDATE THESE TO MATCH YOUR PROD ENVIRONMENT
  - name: prodResourceGroup
    value: 'M3-RG-ALZ-DWHS-ALYTICS-P-1'  # Update with your production resource group
  - name: prodContainerAppName
    value: 'm3acaeaportalp1'  # EA Portal - separate from other deployments
  - name: prodACRRegistry
    value: 'm3acrdwhsp1'
  - name: prodLocation
    value: 'southeastasia'

stages:
- stage: BuildProduction
  displayName: 'Build PM/EA Agent Docker Image for Production'
  jobs:
  - job: Build
    displayName: 'Build and Push PM/EA Agent to Prod ACR'
    steps:
    - task: Bash@3
      displayName: 'Build & Push Image to Prod ACR'
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail

          echo "🔐 Authenticating with Production Service Principal..."
          az login --service-principal \
            --username "$(AZURE_CLIENT_ID)" \
            --password "$(AZURE_SECRET)" \
            --tenant "$(AZURE_TENANT_ID)"
          echo "✅ Authenticated successfully"

          REGISTRY_NAME="$(prodACRRegistry)"
          REPO_NAME="$(imageRepository)"
          TAG="$(tag)"
          IMAGE_FQN="${REGISTRY_NAME}.azurecr.io/${REPO_NAME}:${TAG}"

          echo "🔧 Building production image: ${IMAGE_FQN}"
          az acr build \
            --registry "${REGISTRY_NAME}" \
            --image "${REPO_NAME}:${TAG}" \
            --file "$(dockerfilePath)" \
            "$(Build.SourcesDirectory)"

          echo "🏷️  Tagging image as :latest"
          az acr repository delete --name "${REGISTRY_NAME}" --image "${REPO_NAME}:latest" --yes >/dev/null 2>&1 || true
          az acr import \
            --name "${REGISTRY_NAME}" \
            --source "${REGISTRY_NAME}.azurecr.io/${REPO_NAME}:${TAG}" \
            --image "${REPO_NAME}:latest" \
            --registry "${REGISTRY_NAME}"

          echo "✅ Build complete: ${IMAGE_FQN}"

- stage: DeployProduction
  displayName: 'Deploy PM/EA Agent to Production ACA'
  dependsOn: BuildProduction
  condition: succeeded()
  jobs:
  - deployment: DeployToProd
    displayName: 'Deploy PM/EA Agent to Production'
    environment: 'production'  # 🔐 Enables approval gates in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Bash@3
            displayName: 'Deploy to Production Container Apps'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail

                echo "🔐 Authenticating with Production Service Principal..."
                az login --service-principal \
                  --username "$(AZURE_CLIENT_ID)" \
                  --password "$(AZURE_SECRET)" \
                  --tenant "$(AZURE_TENANT_ID)"
                echo "✅ Authenticated successfully"

                echo "🚀 Starting Production Azure Container Apps deployment..."

                FULL_IMAGE_NAME="$(prodACRRegistry).azurecr.io/$(imageRepository):latest"
                LOCATION="$(prodLocation)"
                RESOURCE_GROUP="$(prodResourceGroup)"
                CONTAINER_APP_NAME="$(prodContainerAppName)"
                ENVIRONMENT_NAME="${CONTAINER_APP_NAME}-env"
                ACR_SERVER="$(prodACRRegistry).azurecr.io"
                ACR_USERNAME="$(prodACRRegistry)"

                echo "📋 Deployment Configuration:"
                echo "   Resource Group: ${RESOURCE_GROUP}"
                echo "   Container App: ${CONTAINER_APP_NAME}"
                echo "   Image: ${FULL_IMAGE_NAME}"
                echo "   Location: ${LOCATION}"
                echo "   Type: Static HTML Portal (nginx)"

                # Retrieve ACR credentials from Key Vault
                # COMMENTED OUT: Using managed identity instead
                # ACR_PASSWORD=$(az keyvault secret show \
                #   --vault-name "${KEY_VAULT_NAME}" \
                #   --name "$(prodACRRegistry)" \
                #   --query "value" -o tsv)

                # echo "🔑 Retrieved ACR credentials from Key Vault"
                echo "🔑 Using managed identity for ACR access (no credentials needed)"

                # Add containerapp extension
                az extension add --name containerapp --upgrade --yes

                # Register providers
                # COMMENTED OUT: Providers already registered in production
                # az provider register --namespace Microsoft.App --wait
                # az provider register --namespace Microsoft.OperationalInsights --wait
                echo "⏭️  Skipping provider registration (already registered in production)"

                # No Key Vault needed for static portal
                echo "⏭️  Skipping Key Vault validation (static HTML only)"

                # Container Apps Environment - Already exists in production
                echo "⏭️  Using existing Container Apps Environment: $ENVIRONMENT_NAME"
                # COMMENTED OUT: Environment already created and stable in production
                # if az containerapp env show --name "$ENVIRONMENT_NAME" --resource-group "${RESOURCE_GROUP}" &>/dev/null; then
                #   ... environment checking and creation logic ...
                # fi

                # Create or update Container App
                if az containerapp show --name "${CONTAINER_APP_NAME}" --resource-group "${RESOURCE_GROUP}" &>/dev/null; then
                  echo "🔄 Updating existing Container App..."
                  az containerapp update \
                    --name "${CONTAINER_APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --image "${FULL_IMAGE_NAME}"
                    # COMMENTED OUT: Using managed identity instead
                    # --registry-server "${ACR_SERVER}" \
                    # --registry-username "${ACR_USERNAME}" \
                    # --registry-password "${ACR_PASSWORD}"
                else
                  echo "🏗️  Creating new Production Container App..."
                  az containerapp create \
                    --name "${CONTAINER_APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --environment "$ENVIRONMENT_NAME" \
                    --image "${FULL_IMAGE_NAME}" \
                    # COMMENTED OUT: Using managed identity instead
                    # --registry-server "${ACR_SERVER}" \
                    # --registry-username "${ACR_USERNAME}" \
                    # --registry-password "${ACR_PASSWORD}" \
                    --target-port 80 \
                    --ingress external \
                    --min-replicas 2 \
                    --max-replicas 5 \
                    --cpu 1.0 \
                    --memory 2.0Gi
                fi

                # Verify deployment
                if ! az containerapp show --name "${CONTAINER_APP_NAME}" --resource-group "${RESOURCE_GROUP}" &>/dev/null; then
                  echo "❌ Container App deployment failed"
                  exit 1
                fi
                echo "✅ Container App created/updated successfully"

                # No secrets needed - static HTML portal!

                APP_URL=$(az containerapp show --name "${CONTAINER_APP_NAME}" --resource-group "${RESOURCE_GROUP}" --query "properties.configuration.ingress.fqdn" -o tsv)
                echo "✅ Production deployment complete!"
                echo "🌐 App URL: https://$APP_URL"

          - task: Bash@3
            displayName: 'Verify Production Deployment'
            inputs:
              targetType: 'inline'
              script: |
                echo "🔐 Authenticating with Production Service Principal for verification..."
                az login --service-principal \
                  --username "$(AZURE_CLIENT_ID)" \
                  --password "$(AZURE_SECRET)" \
                  --tenant "$(AZURE_TENANT_ID)"
                echo "✅ Authenticated successfully"

                echo "🧪 Verifying production deployment..."
                RESOURCE_GROUP="$(prodResourceGroup)"
                CONTAINER_APP_NAME="$(prodContainerAppName)"

                APP_URL=$(az containerapp show --name "${CONTAINER_APP_NAME}" --resource-group "${RESOURCE_GROUP}" --query "properties.configuration.ingress.fqdn" -o tsv)
                echo "⏳ Waiting for application to be ready..."
                sleep 30

                if curl -f "https://$APP_URL/" > /dev/null 2>&1; then
                  echo "✅ Health check passed"
                  echo "🌐 Production App URL: https://$APP_URL"
                  echo "📌 PM/EA Agent available at https://$APP_URL"
                  echo "📌 Verify connectivity: curl -f https://$APP_URL/"
                else
                  echo "⚠️  Health check failed - Check Container App logs for details"
                  exit 1
                fi
